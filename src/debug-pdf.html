<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer Debug</title>
    <style>
        body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .debug-info { 
            background: #f0f0f0; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 8px;
            font-size: 14px;
        }
        .debug-info strong { color: #333; }
        .frame-container { 
            width: 100%; 
            height: 80vh; 
            border: 1px solid #ccc; 
            border-radius: 8px;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .debug-info { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <h3>PDF Viewer Debug Information</h3>
        <p><strong>User Agent:</strong> <span id="userAgent"></span></p>
        <p><strong>Screen Width:</strong> <span id="screenWidth"></span>px</p>
        <p><strong>Screen Height:</strong> <span id="screenHeight"></span>px</p>
        <p><strong>Device Pixel Ratio:</strong> <span id="devicePixelRatio"></span></p>
        <p><strong>Touch Support:</strong> <span id="touchSupport"></span></p>
        <p><strong>Orientation:</strong> <span id="orientation"></span></p>
        <p><strong>Is Mobile Device:</strong> <span id="isMobileDevice"></span></p>
        <p><strong>Should Show Mobile Placeholder:</strong> <span id="shouldShowMobile"></span></p>
    </div>

    <div class="frame-container">
        <iframe 
            src="/explore/that-one-romcom-from-2003/" 
            width="100%" 
            height="100%"
            style="border: none;">
        </iframe>
    </div>

    <script>
        // Update debug info
        function updateDebugInfo() {
            document.getElementById('userAgent').textContent = navigator.userAgent;
            document.getElementById('screenWidth').textContent = window.innerWidth;
            document.getElementById('screenHeight').textContent = window.innerHeight;
            document.getElementById('devicePixelRatio').textContent = window.devicePixelRatio || 1;
            document.getElementById('touchSupport').textContent = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            document.getElementById('orientation').textContent = window.innerHeight > window.innerWidth ? 'Portrait' : 'Landscape';
            
            const isMobileDevice = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            document.getElementById('isMobileDevice').textContent = isMobileDevice;
            
            const isSmallScreen = window.innerWidth <= 1020;
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const shouldShowMobile = isSmallScreen || (isMobileDevice && isTouchDevice);
            document.getElementById('shouldShowMobile').textContent = shouldShowMobile;
        }

        updateDebugInfo();
        window.addEventListener('resize', updateDebugInfo);
        window.addEventListener('orientationchange', () => {
            setTimeout(updateDebugInfo, 100);
        });
    </script>
</body>
</html>
